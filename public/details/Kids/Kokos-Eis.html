<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kokos-Eis</title>
    <link rel="stylesheet" href="../../styles_detail.css">
    <script async src="//platform.getbring.com/widgets/import.js"></script>
</head>
<body>
    <div class="recipe" itemscope itemtype="http://schema.org/Recipe">

        <div class="recipe-header">
            <a href="#" class="close" onclick="history.back(); return false;"></a>

            <img src="../../images/Kids/Kokos-Eis.jpg" itemprop="image" alt="Kokos-Eis"/>
            <div>
                <h1 itemprop="name">Kokos-Eis</h1>
                <p><span>Von </span><span itemprop="author">Cookidoo</span></p>
                <p><span>Portionen: </span><span itemprop="recipeYield">6
Portionen</span></p>
                <p><span>Zubereitungszeit: </span><span itemprop="prepTime">10
Minuten (plus ca. 10 Std. Gefrieren)</span></p>
            </div>
        </div>

        <div class="ingredients-steps">
            <div class="ingredients">
                <h2>Zutaten</h2>
                <ul itemprop="recipeIngredient">
                                            <li>150 g Zucker</li>
                                            <li>50 g Kokosraspeln</li>
                                            <li>¼ Vanilleschote</li>
                                            <li>1 Dose Kokosmilch (400
g)</li>
                                            <li>200 g Sahne</li>
                                            <li>60 g Milch</li>
                                    </ul>
            </div>

            <div class="steps">
                <h2>Zubereitung</h2>
                <ul class="check-list" itemprop="recipeInstructions">
                                            <li>
                            <input type="checkbox">
                            <label for="step---">Das Viertel
Vanilleschote mit Zucker und Kokosraspeln im Mixtopf 20 Sek./Stufe 10 zu
feinem Pulver mahlen, danach vom Rand nach unten schieben.</label>
                        </li>
                                            <li>
                            <input type="checkbox">
                            <label for="step---">Kokosmilch und Sahne
dazugeben und im Mixtopf 15 Sek./Stufe 4 mischen. Die Masse in eine
flache Gefrierdose gießen, mit Frischhaltefolie abdecken und mindestens
10 Std., besser über Nacht, einfrieren.</label>
                        </li>
                                            <li>
                            <input type="checkbox">
                            <label for="step---">Die gefrorene Masse 10
Min. im Kühlschrank antauen lassen und mit einem großen, scharfen Messer
in Würfel von etwa 4 cm schneiden. Die Hälfte der Würfel mit 30 g Milch
im Mixtopf 13 Sek./Stufe 8 cremig rühren und in eine Schüssel
geben.</label>
                        </li>
                                            <li>
                            <input type="checkbox">
                            <label for="step---">Die restlichen Würfel
mit den übrigen 30 g Milch ebenso im Mixtopf 13 Sek./Stufe 8 cremig
rühren und zum ersten Teil geben. Sofort servieren oder, für festeres
Eis, vorher noch 15 Min. ins Gefrierfach stellen.</label>
                        </li>
                                    </ul>
            </div>
        </div>

        <div data-bring-import style="display:none">
            <a href="https://www.getbring.com">Bring! Einkaufsliste App für iPhone und Android</a>
        </div>

    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const items = document.querySelectorAll('.check-list li');
        
            items.forEach((li, index) => {
                const checkbox = li.querySelector('input[type="checkbox"]');
                const label = li.querySelector('label');
        
                const uniqueId = "step-"+(index + 1); // creates step-1, step-2, etc.

                checkbox.id = uniqueId;
                label.htmlFor = uniqueId;

                // Einwiege-Schritt (Thermomix-Waage) markieren: „… in den Mixtopf wiegen“
                if (/\bwiegen\b/i.test(label.textContent)) {
                    li.classList.add('is-weigh');
                    label.insertAdjacentHTML('afterbegin',
                        '<svg class="weigh-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="10" width="17" height="10" rx="2.5"/><path d="M8.2 10 7.5 6.5h9L15.8 10"/><circle cx="12" cy="15" r="2.3"/></svg>');
                }
            });
        });
        </script>

</body>
</html>
