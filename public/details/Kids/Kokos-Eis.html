<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kokos-Eis</title>
    <link rel="stylesheet" href="../../styles_detail.css">
    <script async src="//platform.getbring.com/widgets/import.js"></script>
</head>
<body>
    <div class="recipe" itemscope itemtype="http://schema.org/Recipe">

        <div class="recipe-header">
            <a href="#" class="close" onclick="history.back(); return false;"></a>

            <img src="../../images/Kids/Kokos-Eis.jpg" itemprop="image" alt="Kokos-Eis"/>
            <div>
                <h1 itemprop="name">Kokos-Eis</h1>
                <p><span>Von </span><span itemprop="author">Cookidoo</span></p>
                <p><span>Portionen: </span><span itemprop="recipeYield">6
Portionen</span></p>
                <p><span>Zubereitungszeit: </span><span itemprop="prepTime">10
Minuten (plus ca. 10 Std. Gefrieren)</span></p>
            </div>
        </div>

        <div class="ingredients-steps">
            <div class="ingredients">
                <h2>Zutaten</h2>
                <ul itemprop="recipeIngredient">
                                            <li>150 g Zucker</li>
                                            <li>50 g Kokosraspeln</li>
                                            <li>¼ Vanilleschote</li>
                                            <li>1 Dose Kokosmilch (400
g)</li>
                                            <li>200 g Sahne</li>
                                            <li>60 g Milch</li>
                                    </ul>
            </div>

            <div class="steps">
                <h2>Zubereitung</h2>
                <ul class="check-list" itemprop="recipeInstructions">
                                            <li>
                            <input type="checkbox">
                            <label for="step---">¼ Vanilleschote, 150 g
Zucker und 50 g Kokosraspeln in den Mixtopf wiegen.</label>
                        </li>
                                            <li>
                            <input type="checkbox">
                            <label for="step---">20 Sek./Stufe 10 zu
feinem Pulver mahlen, danach vom Rand nach unten schieben.</label>
                        </li>
                                            <li>
                            <input type="checkbox">
                            <label for="step---">400 g Kokosmilch und
200 g Sahne in den Mixtopf wiegen.</label>
                        </li>
                                            <li>
                            <input type="checkbox">
                            <label for="step---">15 Sek./Stufe 4
mischen. Die Masse in eine flache Gefrierdose gießen, mit
Frischhaltefolie abdecken und mindestens 10 Std., besser über Nacht,
einfrieren.</label>
                        </li>
                                            <li>
                            <input type="checkbox">
                            <label for="step---">Die gefrorene Masse 10
Min. im Kühlschrank antauen lassen und mit einem großen, scharfen Messer
in Würfel von etwa 4 cm schneiden. Die Hälfte der Würfel in den Mixtopf
geben und 30 g Milch dazuwiegen.</label>
                        </li>
                                            <li>
                            <input type="checkbox">
                            <label for="step---">13 Sek./Stufe 8 cremig
rühren und in eine Schüssel geben.</label>
                        </li>
                                            <li>
                            <input type="checkbox">
                            <label for="step---">Die restlichen Würfel
in den Mixtopf geben und die übrigen 30 g Milch dazuwiegen.</label>
                        </li>
                                            <li>
                            <input type="checkbox">
                            <label for="step---">Ebenso 13 Sek./Stufe 8
cremig rühren und zum ersten Teil geben. Sofort servieren oder, für
festeres Eis, vorher noch 15 Min. ins Gefrierfach stellen.</label>
                        </li>
                                    </ul>
            </div>
        </div>

        <div data-bring-import style="display:none">
            <a href="https://www.getbring.com">Bring! Einkaufsliste App für iPhone und Android</a>
        </div>

    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const items = document.querySelectorAll('.check-list li');
        
            items.forEach((li, index) => {
                const checkbox = li.querySelector('input[type="checkbox"]');
                const label = li.querySelector('label');
        
                const uniqueId = "step-"+(index + 1); // creates step-1, step-2, etc.

                checkbox.id = uniqueId;
                label.htmlFor = uniqueId;
            });
        });
        </script>

</body>
</html>
